spring:
  datasource:
    url: jdbc:h2:mem:revisiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

app:
  environment: development
  banner: "Running with DEV profile - H2 in-memory database"

logging:
  level:
    com.electronik54.revision_3: DEBUG
    org.hibernate.SQL: DEBUG
